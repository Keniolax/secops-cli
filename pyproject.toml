[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "secops-cli"
version = "0.1.0"
description = "Small security tools for a home lab: port scan, SSH log triage, TLS certificate check and file integrity monitoring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kolade" }]
# One runtime dependency. watchdog turns the operating system's file-change
# events (FSEvents on macOS, inotify on Linux) into Python callbacks.
dependencies = ["watchdog==6.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

# `pip install` creates a `secops` command that calls main() in cli.py.
[project.scripts]
secops = "secops_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: errors and pyflakes. I: import order. B: likely bugs. UP: modern syntax.
# S: security checks from bandit. SIM: simpler code.
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert on purpose.
"tests/*" = ["S101"]
